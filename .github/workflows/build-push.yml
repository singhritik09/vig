name: CI/CD Pipeline

on:
  push:
    branches: [ development ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build docker image
      run: docker build -t '${{secrets.DOCKER_USERNAME}}'/fastapi-docker:'${{github.sha}}' .

    - name: Login to Docker hub
      run: docker login --username '${{secrets.DOCKER_USERNAME}}' --password '${{secrets.DOCKER_PASSWORD}}'

    - name: Push the image to docker hub
      run: docker push '${{secrets.DOCKER_USERNAME}}'/fastapi-docker:'${{github.sha}}'
  build-frontend:
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
    - uses: actions/checkout@v3

    - name: Build docker image for frontend
      run: docker build -f Dockerfile.frontend -t ${{ secrets.DOCKER_USERNAME }}/react-frontend:${{ github.sha }} .

    - name: Login to Docker hub
      run: docker login --username '${{secrets.DOCKER_USERNAME}}' --password '${{secrets.DOCKER_PASSWORD}}'

    - name: Push the frontend image to Docker hub
      run: docker push '${{secrets.DOCKER_USERNAME}}'/react-frontend:'${{github.sha}}'

  test-backend:
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
    - name: Checkout branch
      uses: actions/checkout@v3
    
    - name: Login to Dockerhub
      run: docker login --username '${{secrets.DOCKER_USERNAME}}' --password '${{secrets.DOCKER_PASSWORD}}'
    
    - name: Pull Image
      run: docker image pull '${{secrets.DOCKER_USERNAME}}'/fastapi-docker:'${{github.sha}}'

    - name: Run container
      run: docker run -d --name jewel_app -p 8000:8000 '${{secrets.DOCKER_USERNAME}}'/fastapi-docker:'${{github.sha}}'

    - name: Test container
      run: |
        sleep 20
        curl -f http://localhost:8000/ || (docker logs fastapi-container && exit 1)
    - name: Stop and remove the container
      run: |
        docker container stop jewel_app
        docker container rm jewel_app

  test-frontend:
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
    - name: Checkout branch
      uses: actions/checkout@v3
    
    - name: Login to Dockerhub
      run: docker login --username '${{secrets.DOCKER_USERNAME}}' --password '${{secrets.DOCKER_PASSWORD}}'
    
    - name: Pull Image
      run: docker image pull '${{ secrets.DOCKER_USERNAME }}'/react-frontend:${{ github.sha }}

    - name: Run container
      run: docker run -d --name client_app -p 3000:3000 '${{secrets.DOCKER_USERNAME}}'/react-frontend:'${{github.sha}}'

    - name: Test container
      run: |
        sleep 20
        curl -f http://localhost:3000/ || (docker logs react-frontend && exit 1)
    - name: Stop and remove the container
      run: |
        docker container stop client_app
        docker container rm client_app

